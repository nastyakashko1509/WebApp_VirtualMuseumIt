{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{% static 'images/icon.png' %}" type="image/png">
    <title>Дополнительная страница</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.3.1"></script>
    <script src="{% static 'js/graphics.js' %}" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f4f8;
            color: #1f2d3d;
        }

        h2 {
            text-align: center;
            color: #1f77b4;
        }

        form {
            margin: 20px auto;
            text-align: center;
        }

        form input {
            margin: 0 10px;
            padding: 5px;
            width: 100px;
            border: 2px solid #1f77b4;
            border-radius: 4px;
            transition: border-color 0.3s;
        }

        form input:focus {
            outline: none;
            border-color: #0056b3;
        }

        form input.error {
            border-color: red;
        }

        form button {
            padding: 5px 15px;
            cursor: pointer;
            background-color: #1f77b4;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        form button:hover {
            background-color: #0056b3;
        }

        #tableContainer {
            margin: 30px auto;
            width: 90%;
            text-align: center;
            overflow-x: auto;
        }

        table, th, td {
            border: 1px solid #1f77b4;
            border-collapse: collapse;
            padding: 5px;
            text-align: center;
        }

        th {
            background-color: #cce5ff;
            color: #1f2d3d;
        }

        td {
            background-color: #e6f0ff;
        }

        #chart-container {
            width: 90%;
            margin: 30px auto;
            text-align: center;
        }

        #saveChart {
            margin-top: 10px;
            padding: 5px 15px;
            cursor: pointer;
            background-color: #1f77b4;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        #saveChart:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Разложение функции arccos(x) в ряд</h2>

    <form id="inputForm">
        <label for="xMax">Максимальное x (от -1 до 1): </label>
        <input type="number" step="0.01" id="xMax" required>
        <p><label for="nMax">Количество членов ряда n (целое > 0): </label>
        <input type="number" id="nMax" required>
        <p><button type="submit">Построить</button>
    </form>

    <div id="chart-container">
        <canvas id="functionChart" width="800" height="400"></canvas>
        <button id="saveChart">Сохранить график</button>
    </div>

    <div id="tableContainer"></div>
</body>
</html>
