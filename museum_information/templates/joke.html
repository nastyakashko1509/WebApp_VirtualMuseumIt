{% extends "base.html" %}

{% block title %}Шутка о программировании{% endblock %}

{% block content %}
<h2>Шутка о программировании</h2>

<div>
    <div id="setup"><strong>{{ joke.setup }}</strong></div>
    <div id="punchline">{{ joke.punchline }}</div>

    {% if gif_url %}
        <div>
            <img src="{{ gif_url }}" alt="Programming gif">
        </div>
    {% endif %}

    <form method="get">
        <button type="submit">Ещё шутку</button>
    </form>

    <button id="speakJoke">Озвучить шутку</button>

    <div id="batteryInfo" style="margin-top:20px; font-size:16px; color:#1f77b4;">
        Информация о батарее загружается...
    </div>
</div>
{% endblock %}
